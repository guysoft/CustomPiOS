name: Run Tests via Makefile

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

jobs:
  test:
    name: Run Makefile Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test GPU sessions and QEMU binary selection
        run: uv run --no-project --with pytest python -m pytest tests/test_gui_gpu.py tests/test_qemu_binary.py -q

      # - name: Install dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y qemu-user-static binfmt-support

      - name: Run Makefile
        run: make test

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
          retention-days: 60
